<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統合 収支・利益管理ダッシュボード（法人 ＆ 個人事業主）</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダーバー -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-inner">
                    <i class="fa-solid fa-chart-pie text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-extrabold tracking-tight flex items-center gap-2">
                        <span>収支 ✕ 利益統合ポータル</span>
                        <span class="text-xs font-normal bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 px-2 py-0.5 rounded-full hidden md:inline-block">法人 ＋ 個人事業主</span>
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold shadow transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i>
                    <span>取引入力</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">
        
        <!-- 事業体切り替え（エンティティ・タブ） -->
        <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex space-x-1 sm:space-x-2 w-full md:w-auto">
                <button id="entityCorporateBtn" onclick="switchEntity('corporate')" class="flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-md">
                    <i class="fa-solid fa-building text-base"></i>
                    <span>🏢 法人 (10月〜9月期)</span>
                </button>
                <button id="entityPersonalBtn" onclick="switchEntity('personal')" class="flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200">
                    <i class="fa-solid fa-user-gear text-base"></i>
                    <span>👤 個人事業主 (1月〜12月)</span>
                </button>
                <button id="entityCombinedBtn" onclick="switchEntity('combined')" class="flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200">
                    <i class="fa-solid fa-scale-balanced text-base"></i>
                    <span>📊 統合比較</span>
                </button>
            </div>
        </div>

        <!-- 1. 法人ビュー -->
        <div id="corporateView" class="space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <input type="month" id="corpMonthPicker" onchange="renderCorporate()" class="text-base font-bold text-slate-800 bg-slate-50 border border-slate-300 rounded-lg px-3 py-1 focus:outline-none">
                </div>
                <div class="text-xs text-slate-600 font-medium bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">
                    創業: 2024年10月 / 決算期: 10月〜9月
                </div>
            </div>

            <!-- 法人KPI -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500">売上高</p>
                    <h3 class="text-lg font-extrabold text-slate-900 mt-1" id="corpSales">¥0</h3>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500">仕入・原価</p>
                    <h3 class="text-lg font-extrabold text-amber-600 mt-1" id="corpCost">¥0</h3>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500">販管費・経費</p>
                    <h3 class="text-lg font-extrabold text-rose-600 mt-1" id="corpExpenses">¥0</h3>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500">営業損益 (税引前)</p>
                    <h3 class="text-lg font-extrabold text-indigo-900 mt-1" id="corpNetProfit">¥0</h3>
                </div>
            </div>

            <!-- 法人 明細 ＆ チャート -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b border-slate-100">
                        <h2 class="font-bold text-slate-800 text-sm">当月の明細データ</h2>
                    </div>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 text-xs border-b border-slate-100">
                            <tr>
                                <th class="py-3 px-4">日付</th>
                                <th class="py-3 px-4">区分</th>
                                <th class="py-3 px-4">メモ</th>
                                <th class="py-3 px-4 text-right">金額</th>
                            </tr>
                        </thead>
                        <tbody id="corpTransactionList" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 text-xs mb-3">収支バランス</h3>
                    <div class="relative h-56"><canvas id="corpChart"></canvas></div>
                </div>
            </div>
        </div>

        <!-- 2. 個人事業主ビュー -->
        <div id="personalView" class="hidden space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <input type="month" id="persMonthPicker" onchange="renderPersonal()" class="text-base font-bold text-slate-800 bg-slate-50 border border-slate-300 rounded-lg px-3 py-1 focus:outline-none">
                <div class="text-xs text-slate-600 font-medium bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100">
                    期間: 1月〜12月 (暦年単位)
                </div>
            </div>

            <!-- 個人KPI -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500">売上高</p>
                    <h3 class="text-lg font-extrabold text-slate-900 mt-1" id="persSales">¥0</h3>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500">必要経費</p>
                    <h3 class="text-lg font-extrabold text-rose-600 mt-1" id="persExpenses">¥0</h3>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500">差引事業所得</p>
                    <h3 class="text-lg font-extrabold text-emerald-700 mt-1" id="persNetProfit">¥0</h3>
                </div>
                <div class="bg-amber-500 text-white p-4 rounded-xl shadow-md">
                    <p class="text-xs font-bold uppercase">納税プール推奨額</p>
                    <h3 class="text-xl font-black mt-1" id="persKeepAmount">¥0</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b border-slate-100">
                        <h2 class="font-bold text-slate-800 text-sm">明細データ</h2>
                    </div>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 text-xs border-b border-slate-100">
                            <tr>
                                <th class="py-3 px-4">日付</th>
                                <th class="py-3 px-4">区分</th>
                                <th class="py-3 px-4">メモ</th>
                                <th class="py-3 px-4 text-right">金額</th>
                            </tr>
                        </thead>
                        <tbody id="persTransactionList" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 text-xs mb-3">収支推移</h3>
                    <div class="relative h-56"><canvas id="persChart"></canvas></div>
                </div>
            </div>
        </div>

        <!-- 3. 統合比較ビュー -->
        <div id="combinedView" class="hidden space-y-6">
            <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-800 text-white p-6 rounded-2xl shadow-lg">
                <div class="space-y-2">
                    <span class="bg-amber-400 text-slate-900 font-extrabold text-xs px-2.5 py-0.5 rounded-full">会社員 比較指標</span>
                    <h3 class="text-xl sm:text-2xl font-black">
                        同じ手取りを得る場合の会社員（給与所得者）換算年収
                    </h3>
                    <div class="text-3xl font-black text-amber-300 mt-2" id="equivSalaryText">¥0</div>
                </div>
            </div>
        </div>

    </main>

    <!-- 取引入力モータル -->
    <div id="inputModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800">取引データの新規登録</h3>
            <form id="txForm" onsubmit="handleSaveTx(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">対象事業体</label>
                    <select id="txEntity" class="w-full text-sm border border-slate-300 rounded-lg p-2">
                        <option value="corporate">🏢 法人</option>
                        <option value="personal">👤 個人事業主</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">日付</label>
                    <input type="date" id="txDate" required class="w-full text-sm border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">区分</label>
                    <select id="txCategory" class="w-full text-sm border border-slate-300 rounded-lg p-2">
                        <option value="sales">売上</option>
                        <option value="cost">仕入・原価</option>
                        <option value="expense">経費</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">金額 (円)</label>
                    <input type="number" id="txAmount" required min="0" class="w-full text-sm border border-slate-300 rounded-lg p-2" placeholder="100000">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">メモ</label>
                    <input type="text" id="txMemo" class="w-full text-sm border border-slate-300 rounded-lg p-2" placeholder="摘要・備考">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        // デモ用ローカルデータ（Supabase未連携時にも動くフォールバック）
        let transactions = [
            { id: 1, entity: 'corporate', date: '2026-09-10', category: 'sales', amount: 800000, memo: 'クライアントA受託制作' },
            { id: 2, entity: 'corporate', date: '2026-09-12', category: 'expense', amount: 120000, memo: 'オフィス家賃' },
            { id: 3, entity: 'personal', date: '2026-09-05', category: 'sales', amount: 350000, memo: '個人執筆案件' },
            { id: 4, entity: 'personal', date: '2026-09-14', category: 'expense', amount: 45000, memo: '書籍・勉強代' },
        ];

        let corpChartInstance = null;
        let persChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date().toISOString().substring(0, 7);
            document.getElementById('corpMonthPicker').value = now;
            document.getElementById('persMonthPicker').value = now;
            document.getElementById('txDate').valueAsDate = new Date();

            renderCorporate();
            renderPersonal();
            renderCombined();
        });

        function switchEntity(entity) {
            document.getElementById('corporateView').classList.add('hidden');
            document.getElementById('personalView').classList.add('hidden');
            document.getElementById('combinedView').classList.add('hidden');

            document.getElementById('entityCorporateBtn').className = "flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200";
            document.getElementById('entityPersonalBtn').className = "flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200";
            document.getElementById('entityCombinedBtn').className = "flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200";

            if (entity === 'corporate') {
                document.getElementById('corporateView').classList.remove('hidden');
                document.getElementById('entityCorporateBtn').className = "flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-md";
                renderCorporate();
            } else if (entity === 'personal') {
                document.getElementById('personalView').classList.remove('hidden');
                document.getElementById('entityPersonalBtn').className = "flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-md";
                renderPersonal();
            } else {
                document.getElementById('combinedView').classList.remove('hidden');
                document.getElementById('entityCombinedBtn').className = "flex-1 md:flex-initial px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-indigo-900 text-white shadow-md";
                renderCombined();
            }
        }

        function renderCorporate() {
            const month = document.getElementById('corpMonthPicker').value;
            const filtered = transactions.filter(t => t.entity === 'corporate' && t.date.startsWith(month));

            let sales = 0, cost = 0, expenses = 0;
            const tbody = document.getElementById('corpTransactionList');
            tbody.innerHTML = '';

            filtered.forEach(t => {
                if (t.category === 'sales') sales += t.amount;
                if (t.category === 'cost') cost += t.amount;
                if (t.category === 'expense') expenses += t.amount;

                tbody.innerHTML += `
                    <tr>
                        <td class="py-3 px-4">${t.date}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-bold ${t.category === 'sales' ? 'bg-indigo-100 text-indigo-700' : 'bg-rose-100 text-rose-700'}">${t.category}</span></td>
                        <td class="py-3 px-4">${t.memo || '-'}</td>
                        <td class="py-3 px-4 text-right font-bold">¥${t.amount.toLocaleString()}</td>
                    </tr>
                `;
            });

            const net = sales - cost - expenses;
            document.getElementById('corpSales').innerText = `¥${sales.toLocaleString()}`;
            document.getElementById('corpCost').innerText = `¥${cost.toLocaleString()}`;
            document.getElementById('corpExpenses').innerText = `¥${expenses.toLocaleString()}`;
            document.getElementById('corpNetProfit').innerText = `¥${net.toLocaleString()}`;

            // チャート描写
            const ctx = document.getElementById('corpChart').getContext('2d');
            if (corpChartInstance) corpChartInstance.destroy();
            corpChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['売上', '仕入', '経費'],
                    datasets: [{
                        data: [sales, cost, expenses],
                        backgroundColor: ['#4f46e5', '#f59e0b', '#f43f5e']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderPersonal() {
            const month = document.getElementById('persMonthPicker').value;
            const filtered = transactions.filter(t => t.entity === 'personal' && t.date.startsWith(month));

            let sales = 0, expenses = 0;
            const tbody = document.getElementById('persTransactionList');
            tbody.innerHTML = '';

            filtered.forEach(t => {
                if (t.category === 'sales') sales += t.amount;
                else expenses += t.amount;

                tbody.innerHTML += `
                    <tr>
                        <td class="py-3 px-4">${t.date}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-bold ${t.category === 'sales' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${t.category}</span></td>
                        <td class="py-3 px-4">${t.memo || '-'}</td>
                        <td class="py-3 px-4 text-right font-bold">¥${t.amount.toLocaleString()}</td>
                    </tr>
                `;
            });

            const net = sales - expenses;
            const taxKeep = Math.max(0, net * 0.2); // 概算税金キープ率 20%

            document.getElementById('persSales').innerText = `¥${sales.toLocaleString()}`;
            document.getElementById('persExpenses').innerText = `¥${expenses.toLocaleString()}`;
            document.getElementById('persNetProfit').innerText = `¥${net.toLocaleString()}`;
            document.getElementById('persKeepAmount').innerText = `¥${Math.round(taxKeep).toLocaleString()}`;

            // チャート描写
            const ctx = document.getElementById('persChart').getContext('2d');
            if (persChartInstance) persChartInstance.destroy();
            persChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['売上', '必要経費', '所得'],
                    datasets: [{
                        label: '金額',
                        data: [sales, expenses, net],
                        backgroundColor: ['#10b981', '#f43f5e', '#059669']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderCombined() {
            const totalSales = transactions.filter(t => t.category === 'sales').reduce((acc, t) => acc + t.amount, 0);
            const totalExpense = transactions.filter(t => t.category !== 'sales').reduce((acc, t) => acc + t.amount, 0);
            const netTakeHome = totalSales - totalExpense;

            // 会社員換算（簡易ロジック: 手取り / 0.75）
            const equivSalary = Math.round(netTakeHome / 0.75);
            document.getElementById('equivSalaryText').innerText = `¥${equivSalary.toLocaleString()}`;
        }

        // モーダル操作
        function openModal() {
            document.getElementById('inputModal').classList.remove('hidden');
            document.getElementById('inputModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('inputModal').classList.add('hidden');
            document.getElementById('inputModal').classList.remove('flex');
        }

        function handleSaveTx(e) {
            e.preventDefault();
            const newTx = {
                id: Date.now(),
                entity: document.getElementById('txEntity').value,
                date: document.getElementById('txDate').value,
                category: document.getElementById('txCategory').value,
                amount: parseFloat(document.getElementById('txAmount').value) || 0,
                memo: document.getElementById('txMemo').value
            };

            transactions.push(newTx);
            closeModal();
            
            renderCorporate();
            renderPersonal();
            renderCombined();
        }
    </script>
</body>
</html>
